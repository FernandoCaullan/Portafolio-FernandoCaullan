<!-- ================= CONTACTO ================= -->
<section id="contacto" class="py-5">

  <div class="container">

    <h2 class="text-center mb-4">
      Contacto
    </h2>

    <div class="row justify-content-center">

      <div class="col-lg-7">

        <div class="bg-white shadow-sm rounded-4 p-4">

          <form id="contactForm">

            <!-- NOMBRE -->
            <div class="mb-3">

              <label class="form-label">
                Nombre
              </label>

              <input type="text"
                     class="form-control"
                     name="nom_jefe"
                     required>

            </div>

            <!-- CORREO -->
            <div class="mb-3">

              <label class="form-label">
                Correo
              </label>

              <input type="email"
                     class="form-control"
                     name="email"
                     required>

            </div>

            <!-- ASUNTO -->
            <div class="mb-3">

              <label class="form-label">
                Asunto
              </label>

              <input type="text"
                     class="form-control"
                     name="dato_importa"
                     required>

            </div>

            <!-- MENSAJE -->
            <div class="mb-3">

              <label class="form-label">
                Mensaje
              </label>

              <textarea class="form-control"
                        name="msg_importa"
                        rows="5"
                        required></textarea>

            </div>

            <!-- BOTÓN -->
            <button type="submit"
                    class="btn btn-warning w-100 fw-semibold">

              Enviar mensaje

            </button>

          </form>

          <!-- RESPUESTA -->
          <div id="contactResponse"
               class="mt-3 text-center">
          </div>

        </div>

      </div>

    </div>

  </div>

</section>

        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form id="loginForm" method="POST" action="assets/forms/login.php">

          <div class="mb-3">
            <label>Usuario</label>
            <input type="text" name="user" class="form-control" required>
          </div>

          <div class="mb-3">
            <label>Contraseña</label>
            <input type="password" name="pass" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-warning w-100">
            Entrar
          </button>

        </form>

      </div>

    </div>
  </div>
</div>
